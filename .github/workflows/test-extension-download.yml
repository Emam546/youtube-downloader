name: Test Extension Download

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download extension
        run: npm run download:extension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify extension was downloaded
        run: |
          if [ -d "resources/browser-extension/chrome-built" ]; then
            echo "Extension directory exists"
            ls -la resources/browser-extension/chrome-built
            if [ -f "resources/browser-extension/chrome-built/manifest.json" ]; then
              echo "manifest.json found"
              cat resources/browser-extension/chrome-built/manifest.json
            else
              echo "ERROR: manifest.json not found"
              exit 1
            fi
          else
            echo "ERROR: Extension directory not found"
            exit 1
          fi
